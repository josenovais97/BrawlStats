# Runs the Bubble test APK (the `bubble-test` release) on an Android emulator
# for screens, clips and a crash check. The walk itself is deploy/app-footage/
# shoot.py. This version only clears the pictures of the last walk: the
# workflow that shoots is in this branch's history.
name: App footage

on:
  push:
    branches: [app-footage]

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the published pictures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete app-footage --cleanup-tag --yes
