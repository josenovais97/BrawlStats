# Sampling schedule.
#
# Vercel's scheduler is not reliable for this project: the Hobby plan permits
# two cron jobs triggered once a day, and the four declared in vercel.json
# stopped firing entirely (logs show no vercel-cron requests at the scheduled
# times). One run a day is not enough. A Brawl Stars battle log holds only a
# player's last ~25 matches, and measured across 1,545 visits, 68% of sampled
# players already come back sitting on that ceiling. Everything past it is lost
# for good, so the gap between runs is the gap in the data.
#
# GitHub Actions costs nothing here: the job is a single HTTP request that
# finishes in seconds, well inside the free minutes even on a private repo, and
# it has no cron-count limit. The vercel.json entries stay as a fallback, so a
# failure here degrades to Vercel's schedule rather than to nothing.
name: Refresh stats

on:
  schedule:
    # Every three hours, at :17 rather than :00.
    #
    # The interval is set by the battle log, not by taste. It holds a player's
    # last ~25 matches, so anything they play beyond that between visits is
    # lost; three hours keeps all but the most relentless accounts under the
    # ceiling. Measured at a six-hour interval, 68% of players came back capped.
    #
    # The offset matters more than it looks. GitHub queues scheduled workflows
    # and the top of the hour is by far the most contended slot, so ':00' jobs
    # routinely start 10-20 minutes late or get dropped under load. An odd
    # minute is far likelier to fire on time.
    #
    # Costs, all inside free tiers at this cadence:
    #   Actions   ~3 min/run x 8/day  = ~745 min/month (2,000 free, private repo)
    #   Brawl API ~2,018 calls/run    = ~16k/day, ~11/s only during a run
    #   Vercel    ~184s of a 300s Hobby function ceiling, 8 invocations/day
    # Halving the frequency to '17 */6 * * *' halves all three if any gets tight.
    - cron: '17 */3 * * *'
  # Manual trigger, for testing a change without waiting for the schedule.
  workflow_dispatch:

# Two runs overlapping would double the upstream call rate for no extra data,
# since the second would re-read players the first is already walking.
concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The endpoint self-limits to a 270s budget; this only guards a hang.
    timeout-minutes: 10
    steps:
      - name: Trigger sampling run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in this repository's Actions secrets."
            exit 1
          fi

          # Always the canonical domain, never brawlzone.vercel.app.
          #
          # This pointed at the vercel.app host until 2026-08-24, when that
          # domain was set to 308-redirect to brawlzone.net and every run began
          # failing: curl does not follow redirects without -L, so the workflow
          # saw a 308, failed its 2* test, and sampling stopped silently apart
          # from a red run in the Actions tab.
          #
          # Adding -L would not have fixed it either. The redirect crosses
          # hosts, and curl drops the Authorization header on a cross-host
          # redirect unless --location-trusted is used — so it would have
          # traded the 308 for a 401. Sending the credential only to the host
          # it belongs to is the correct behaviour; the URL is what was wrong.
          #
          # --max-time is above the endpoint's own budget so a slow run is
          # reported by the endpoint rather than cut off mid-write here.
          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://brawlzone.net/api/cron/refresh-stats)

          echo "HTTP $status"
          cat /tmp/body
          echo

          # A non-2xx is a real failure worth a red run: silent sampling
          # failures are how the data quietly goes stale.
          case "$status" in
            2*) exit 0 ;;
            *)  echo "::error::Sampling run failed with HTTP $status"; exit 1 ;;
          esac
