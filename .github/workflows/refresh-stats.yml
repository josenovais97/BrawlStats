# Sampling schedule.
#
# The work runs *here*, in the runner, rather than being POSTed to the deployed
# site. It used to be a `curl` at https://brawlzone.net/api/cron/refresh-stats,
# which made a Vercel Function do the sampling — and a Vercel Function is the
# most expensive place this project can put CPU. Measured 2026-08-25: ~184s a
# run at eight runs a day is ~12.3 hours a month against a 4-hour Fluid Active
# CPU allowance on Hobby, so the batch job alone could exceed the entire plan
# before a single page was rendered. GitHub's minutes are free at this cadence
# and have no 300-second ceiling.
#
# Vercel's scheduler was never the right home for it anyway: the Hobby plan
# permits two cron jobs triggered once a day, and the entries in vercel.json
# stopped firing entirely (18 invocations in a 30-day window where 60 were
# due). Those entries have now been removed rather than kept as a fallback —
# a fallback that fires unpredictably and costs 184s of function time when it
# does is worse than none, and this workflow runs eight times as often.
#
# The route itself is kept as a manual trigger. See app/api/cron/refresh-stats.
name: Refresh stats

on:
  schedule:
    # Every three hours, at :17 rather than :00.
    #
    # The interval is set by the battle log, not by taste. It holds a player's
    # last ~25 matches, so anything they play beyond that between visits is
    # lost; three hours keeps all but the most relentless accounts under the
    # ceiling. Measured at a six-hour interval, 68% of players came back capped.
    #
    # The offset matters more than it looks. GitHub queues scheduled workflows
    # and the top of the hour is by far the most contended slot, so ':00' jobs
    # routinely start 10-20 minutes late or get dropped under load. An odd
    # minute is far likelier to fire on time.
    #
    # Costs, all inside free tiers at this cadence:
    #   Actions   ~5 min/run x 8/day  = ~1,200 min/month (2,000 free, private)
    #   Brawl API ~2,018 calls/run    = ~16k/day, ~11/s only during a run
    #   Vercel    nothing at all, which is the point of this file
    # Halving the frequency to '17 */6 * * *' halves all three if any gets tight.
    - cron: '17 */3 * * *'
  # Manual trigger, for testing a change without waiting for the schedule.
  workflow_dispatch:

# Two runs overlapping would double the upstream call rate for no extra data,
# since the second would re-read players the first is already walking.
concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The run self-limits to a 270s work budget; this only guards a hang, and
    # allows for install and Prisma generation on top of it.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 24, matching the version the lock file is generated with locally.
      #
      # Not cosmetic. `npm ci` refuses to run when the lock disagrees with
      # package.json, and npm 10 and 11 resolve the optional wasm peer deps
      # under @tailwindcss/oxide-wasm32-wasi differently — which is exactly
      # what failed here twice, on @emnapi/core and @emnapi/runtime. Keeping
      # CI on the same major as whoever regenerates the lock removes the
      # disagreement rather than papering over it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs `postinstall`, which is `prisma generate` — so the client
      # in src/generated exists before the script imports it.
      #
      # The fallback is deliberate. `npm ci` is the right default: it is fast
      # and it installs exactly what the lock says. But it also *refuses to
      # run* on any disagreement between the lock and package.json, and that
      # took sampling down twice on 2026-08-25 over two optional wasm peer
      # deps that this job never loads — it talks to Postgres and one HTTP API
      # and does not build CSS.
      #
      # Weigh the two failure modes. A stale lock here means slightly drifted
      # dev dependencies in a script with no user-facing output. A refused
      # install means no sampling at all, and the battle log only holds a
      # player's last ~25 matches, so every missed run is data that cannot be
      # recovered. The warning keeps the drift visible instead of silent.
      - name: Install dependencies
        run: |
          npm ci || {
            echo "::warning::npm ci refused the lock file; falling back to npm install. Regenerate the lock with 'npm install' and commit it."
            npm install --no-audit --no-fund
          }

      - name: Run sampling
        env:
          # The direct (non-pooled) Neon endpoint. This job holds one
          # connection for minutes and pushes the roll-up's large statements
          # through it, which is not what PgBouncer is for — see the note in
          # scripts/refresh-stats.ts. DATABASE_URL is accepted as a fallback.
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
        # The script checks its own result and exits non-zero on the failures
        # worth a red run; see scripts/refresh-stats.ts for which and why.
        run: npm run stats:refresh
