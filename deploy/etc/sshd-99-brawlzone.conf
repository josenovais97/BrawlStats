# Password login for one named account only.
#
# Port 22 is open to the internet and actively scanned, so the username is
# half the defence: root/admin/ubuntu/user are what the bots try. Everything
# else stays key-only, and fail2ban bans 4 failures in 10 minutes for an hour.
PasswordAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3

Match User jpn
    PasswordAuthentication yes
