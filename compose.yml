services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://brawlzone.net}
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    volumes:
      # The ISR cache. Without this the container re-renders all ~1,000 URLs
      # from cold on every restart and deploy.
      - next-cache:/app/.next/cache

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  next-cache:
  caddy-data:
  caddy-config:
