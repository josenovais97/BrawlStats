services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    # Deliberately no `ports:`. Postgres is reachable only over the compose
    # network, so nothing needs firewalling and there is no public surface.
    # Anything that needs a shell into it goes through `docker compose exec`.
    command:
      - postgres
      # Tuned for 11 GB / 2 cores against a ~120 MB database: enough shared
      # buffers to hold the whole thing, the rest left to the page cache.
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://brawlzone.net}
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    volumes:
      # The ISR cache. Without this the container re-renders all ~1,000 URLs
      # from cold on every restart and deploy.
      - next-cache:/app/.next/cache
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Batch sampler. Built from the `builder` stage because it needs tsx, the dev
  # dependencies and scripts/ -- none of which survive into the standalone
  # runtime image. Behind a profile so it never starts with the stack; a
  # systemd timer runs it every three hours via `docker compose run --rm`.
  #
  # Three hours is set by the battle log, not by cost: it holds a player's last
  # ~25 matches and there is no history endpoint, so anything played beyond
  # that between samples is lost permanently.
  sampler:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    restart: "no"
    env_file: .env.production
    command: ["npm", "run", "stats:refresh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  next-cache:
  caddy-data:
  caddy-config:
