services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    # Deliberately no `ports:`. Postgres is reachable only over the compose
    # network, so nothing needs firewalling and there is no public surface.
    # Anything that needs a shell into it goes through `docker compose exec`.
    command:
      - postgres
      # Tuned for 11 GB / 2 cores against a ~120 MB database: enough shared
      # buffers to hold the whole thing, the rest left to the page cache.
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=50
    ports:
      # Loopback only. Not a public surface -- this exists so `docker build`,
      # which does not join the compose network, can reach the database to
      # prerender pages.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        # Docker's default is json-file with NO limit, so a container log grows
        # until the disk does. 20 MB x 5 caps each service at 100 MB.
        max-size: "20m"
        max-file: "5"

  app:
    build:
      context: .
      network: host
      secrets:
        - build_env
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://brawlzone.net}
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    volumes:
      # The ISR cache. Without this the container re-renders all ~1,000 URLs
      # from cold on every restart and deploy.
      - next-cache:/app/.next/cache
    healthcheck:
      # node rather than curl: the standalone runtime image has neither curl
      # nor wget. Node 24 has fetch built in.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        # Docker's default is json-file with NO limit, so a container log grows
        # until the disk does. 20 MB x 5 caps each service at 100 MB.
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Access log lands beside the scheduled-job logs so one logrotate rule
      # covers everything and one directory answers "what happened".
      - /var/log/brawlzone:/var/log/brawlzone
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        # Docker's default is json-file with NO limit, so a container log grows
        # until the disk does. 20 MB x 5 caps each service at 100 MB.
        max-size: "20m"
        max-file: "5"

  # Batch sampler. Built from the `builder` stage because it needs tsx, the dev
  # dependencies and scripts/ -- none of which survive into the standalone
  # runtime image. Behind a profile so it never starts with the stack; a
  # systemd timer runs it every three hours via `docker compose run --rm`.
  #
  # Three hours is set by the battle log, not by cost: it holds a player's last
  # ~25 matches and there is no history endpoint, so anything played beyond
  # that between samples is lost permanently.
  sampler:
    build:
      context: .
      target: builder
      # Must match the app's build config exactly. The builder stage ends in
      # `RUN --mount=type=secret,id=build_env ... npm run build`, so without the
      # secret the mount point does not exist, `. /run/secrets/build_env` fails,
      # and sh returns 2 -- which is what broke the sampler on 2026-08-27.
      # Matching also means both services share one set of cached layers.
      network: host
      secrets:
        - build_env
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://brawlzone.net}
    profiles: ["tools"]
    restart: "no"
    env_file: .env.production
    command: ["npm", "run", "stats:refresh"]
    depends_on:
      db:
        condition: service_healthy

secrets:
  build_env:
    file: ./.env.production

volumes:
  pgdata:
  next-cache:
  caddy-data:
  caddy-config:
