<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge harness</title>
<style>
  body { font: 12px system-ui, sans-serif; background: #0b0f1d; color: #dfe4f5; margin: 0; padding: 8px; }
  button { font: inherit; padding: 6px 10px; margin: 2px; border-radius: 6px; border: 1px solid #33415f; background: #141a2e; color: #dfe4f5; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 10px; background: #111729; padding: 6px; border-radius: 6px; max-height: 40vh; overflow: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .slot { display: inline-block; min-width: 54px; padding: 3px 5px; margin: 1px; border-radius: 4px; background: #1a2340; }
  .recognized { background: #1f4d2c; } .empty { background: #333; } .unknown { background: #4d3a1f; } .occluded { background: #4d1f2c; }
</style>
<!--
  A stand-in for /bubble/panel that speaks the bridge protocol exactly as the
  panel does, and nothing else: register handlers, hand over the roster, say
  ready, acknowledge results. It exists so the Android half can be driven on an
  emulator without the site's database behind it. Serve it with

      cd android/harness && python3 -m http.server 8765

  and build with -PpanelOrigin=http://10.0.2.2:8765.
-->
<div class="row">
  <span id="state">state: ?</span>
  <button onclick="BrawlZoneScan.enable()">Allow capture</button>
  <button onclick="BrawlZoneScan.scan()">Scan</button>
  <button onclick="BrawlZoneScan.stop()">Stop</button>
  <button onclick="log('detail', JSON.parse(BrawlZoneScan.scanDetail()))">Detail</button>
  <button onclick="log('export', BrawlZoneScan.exportDiagnostics())">Export</button>
</div>
<div id="slots"></div>
<pre id="log"></pre>

const lines = [];
function log(tag, value) {
  lines.unshift(new Date().toISOString().slice(11, 23) + ' ' + tag + ' ' + (typeof value === 'string' ? value : JSON.stringify(value)));
  out.textContent = lines.slice(0, 40).join('\n');
  console.log('HARNESS ' + tag + ' ' + (typeof value === 'string' ? value : JSON.stringify(value)));
}
function show(p) {
  const el = document.getElementById('slots');
  if (!p.ok) { el.innerHTML = '<b>' + p.screen + '</b> ' + (p.reason || ''); return; }
  el.innerHTML = ['bans', 'allies', 'enemies'].map((k) =>
    '<div><b>' + k + '</b> ' + (p[k] || []).map((s, i) =>
      '<span class="slot ' + s.status + '">' + i + (i === p.self && k === 'allies' ? '*' : '') + ' ' + (s.id ? (NAMES[s.id] || s.id) : s.status) + ' ' + (s.score ?? '') + '</span>').join('') + '</div>').join('') +
    '<div>map=' + p.map + ' mode=' + p.mode + ' ocr=' + p.ocr + ' modeText=' + JSON.stringify(p.modeText) + ' mapText=' + JSON.stringify(p.mapText) + ' layout=' + JSON.stringify(p.layout) + '</div>';
}
window.brawlzone = {
  scanState(s) { document.getElementById('state').textContent = 'state: ' + s; log('state', s); },
  scanResult(p) { log('result', p); show(p); if (p.id !== undefined) BrawlZoneScan.ack(p.id); },
};
try {
  log('status', BrawlZoneScan.status());
  BrawlZoneScan.roster(JSON.stringify(ROSTER));
  BrawlZoneScan.ready();
} catch (e) { log('error', String(e)); }
</script>
